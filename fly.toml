app = "orenda-cherepashka-webbs"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "4174"
  DATABASE_PATH = "/data/site.db"
  SECURE_COOKIES = "true"

[http_service]
  internal_port = 4174
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[mounts]]
  source = "app_data"
  destination = "/data"

[vm]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"