project_id = "orenda-cherepashka"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
enabled = true
enable_signup = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits"

[functions.orenda-public]
verify_jwt = false

[functions.orenda-admin]
verify_jwt = true

[functions.telegram-webhook]
verify_jwt = false
