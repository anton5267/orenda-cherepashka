services:
  - type: web
    name: orenda-cherepashka
    runtime: docker
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_PATH
        value: /app/data/site.db
      - key: DATABASE_BACKUP_DIR
        value: /app/data/backups
      - key: SECURE_COOKIES
        value: true
      - key: PUBLIC_SITE_URL
        value: https://orenda-cherepashka.pages.dev
      - key: PUBLIC_API_ALLOWED_ORIGINS
        value: https://orenda-cherepashka.pages.dev
      - key: TELEGRAM_AUTO_PUBLISH
        value: true
      - key: TELEGRAM_CHANNEL_ID
        value: "@arenda_cherepashka"
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_ADMIN_CHAT_ID
        sync: false
    disk:
      name: orenda-data
      mountPath: /app/data
      sizeGB: 1
