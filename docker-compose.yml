services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orenda-cherepashka
    init: true
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4174
      DATABASE_PATH: /app/data/site.db
    ports:
      - "8080:4174"
    volumes:
      - app-data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4174/api/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  app-data:
