name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify typecheck, build, and local self-QA
        run: npm run ci:verify

      - name: Upload self-QA artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: self-qa-artifacts
          path: |
            artifacts/self-qa/**
            .local/**
          if-no-files-found: ignore
